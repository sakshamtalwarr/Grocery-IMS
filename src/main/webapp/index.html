    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
          height: 100vh;
          background: linear-gradient(-45deg, #77b7e8, #498dc5);
          background-size: 400% 400%;
          animation: gradientBG 20s ease infinite;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #4f1141;
          position: relative;
          overflow: hidden;
        }

        @keyframes gradientBG {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        .login-container {
          background: rgba(0, 0, 0, 0.05);
          border-radius: 15px;
          padding: 40px;
          width: 350px;
          box-shadow: 0 0 20px rgba(248, 248, 248, 0.3);
          backdrop-filter: blur(12px);
          z-index: 1;
          position: relative;
        }
         .login-container::before {
          content: "";
          position: absolute;
          top: -10px;
          left: -10px;
          right: -10px;
          bottom: -10px;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent 70%);
          z-index: -1;
          border-radius: 20px;
          animation: ambientGlow 3s infinite alternate ease-in-out;
       }
        .hover-logo {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            z-index: 2;
            display: none;
            animation: popup 0.3s ease-out;
        }

        @keyframes popup {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        @keyframes ambientGlow {
          0% { box-shadow: 0 0 15px rgba(0, 0, 0, 0.3); }
          100% { box-shadow: 0 0 35px rgb(255, 255, 255); }
        }

        h2 {
          text-align:center;
          margin-bottom: 30px;
          font-size: 26px;
          color: #ffffff;
        }

        button {
          width: 100%;
          padding: 10px;
          margin-top: 10px;
          border: none;
          border-radius: 10px;
          background-color: #000101;
          color: #fff;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.3s ease;
        }

        button:hover {
          background-color: #e44646;
        }

        .clock {
          position: absolute;
          top: 20px;
          right: 20px;
          font-size: 18px;
          font-weight: bold;
          color: #f0f0f0;
          background: rgba(255, 255, 255, 0.1);
          padding: 8px 12px;
          border-radius: 10px;
          backdrop-filter: blur(5px);
        }

        .gif {
          position: absolute;
          bottom: 50px;
          width: 120px;
          height: auto;
          background-color: #f0f0f0;
          border-radius: 10px;
          color: rgb(234, 15, 15);
          padding: 10px;
          box-shadow: 0 0 20px rgba(111, 44, 44, 0.3);
          animation: ambientGlow 5s infinite alternate ease-in-out;
        }

        button.register {
          background-color: #ffffff;
          margin-top: 10px;
          color: #000;
        }

        button.register:hover {
          background-color: #e44646;
        }
        
        /* --- DB Status Notification Styles --- */
        .status-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .status-notification.show {
            opacity: 1;
            visibility: visible;
        }
        .status-notification.success {
            background-color: #28a745;
        }
        .status-notification.error {
            background-color: #dc3545;
        }

        /* --- STYLES FOR WELCOME SCREEN --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1c212e;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.8s ease-out 0.5s, visibility 0.8s 0.5s;
            opacity: 1;
            visibility: visible;
        }
        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .welcome-content {
            animation: fadeInContent 1.5s ease-out forwards;
        }
        .welcome-content h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .welcome-content p {
            font-size: 1.5rem;
            color: #a0a8b7;
            margin-bottom: 2.5rem;
        }
        .loading-bar {
            width: 250px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }
        .loading-progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            transform: translateX(-100%);
            animation: loading 3s ease-out forwards;
        }

        @keyframes fadeInContent {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes loading {
            from { transform: translateX(-100%); }
            to { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- Animated Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <h1>Welcome to Grocery Inventory Management System</h1>
            <p>Made by Saksham Talwar</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- DB Status Notification -->
    <div id="dbStatusNotification" class="status-notification"></div>

    <!-- Original Homepage Content -->
    <img id="employeeLogo" class="hover-logo" src="https://cdn-icons-png.flaticon.com/128/6186/6186048.png" alt="Employee" />
    <img id="adminLogo" class="hover-logo" src="https://cdn-icons-png.flaticon.com/128/9322/9322127.png" alt="Admin" />

    <div class="clock" id="clock"></div>

    <img src="https://undesirable-reindeer.files.svdcdn.com/production/inventory-illustration.gif?dm=1736531575" alt="gif" class="gif" />

    <div class="login-container">
        <h2>HOMEPAGE</h2>
        <button class="loginemployee" type ="button" onclick="window.location.href='EmployeeLogin.html'">Click here to login as Employee</button>
        <button class="loginadmin" type ="button" onclick="window.location.href='Adminlogin.html'">Click here to login as Admin</button>
        <button class="register" type="button" onclick="window.location.href='RegisterEmployee.html'">Register</button>
    </div>

<script>
    // --- Combined Script Logic ---
    window.addEventListener('load', () => {
        const welcomeScreen = document.getElementById('welcome-screen');
        const notification = document.getElementById('dbStatusNotification');

        // This function will run after the welcome screen animation is complete
        function checkDatabaseStatus() {
            // We need a DbStatusServlet for this to work
            fetch('DbStatusServlet')
                .then(response => response.json())
                .then(data => {
                    notification.textContent = data.message;
                    if (data.status === 'success') {
                        notification.classList.add('success');
                    } else {
                        notification.classList.add('error');
                    }
                    notification.classList.add('show');
                    setTimeout(() => {
                        notification.classList.remove('show');
                    }, 4000);
                })
                .catch(error => {
                    console.error('Could not check DB status:', error);
                    notification.textContent = 'Could not contact server.';
                    notification.classList.add('error', 'show');
                    setTimeout(() => {
                        notification.classList.remove('show');
                    }, 4000);
                });
        }

        // Hide the welcome screen after 3.5 seconds
        setTimeout(() => {
            if (welcomeScreen) {
                welcomeScreen.classList.add('hidden');
            }
            // Check the database status AFTER the welcome screen is hidden
            checkDatabaseStatus();
        }, 3500); 
    });

    // --- Original Clock and Hover Logic ---
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('en-IN', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true,
          timeZone: 'Asia/Kolkata'
      });
      document.getElementById('clock').textContent = `IST: ${timeString}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const employeeBtn = document.querySelector("button[onclick*='EmployeeLogin']");
    const adminBtn = document.querySelector("button[onclick*='Adminlogin']");
    const employeeLogo = document.getElementById("employeeLogo");
    const adminLogo = document.getElementById("adminLogo");

    employeeBtn.addEventListener("mouseenter", () => {
        employeeLogo.style.display = "block";
        adminLogo.style.display = "none";
    });
    employeeBtn.addEventListener("mouseleave", () => {
        employeeLogo.style.display = "none";
    });
    adminBtn.addEventListener("mouseenter", () => {
        adminLogo.style.display = "block";
        employeeLogo.style.display = "none";
    });
    adminBtn.addEventListener("mouseleave", () => {
        adminLogo.style.display = "none";
    });
</script>
</body>
