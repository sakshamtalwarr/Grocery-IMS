  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(-45deg, #77b7e8, #427fb1);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #acc3cb;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .registration-form {
      background: rgba(255, 249, 249, 0.05);
      padding: 40px; /* Increased padding for better spacing */
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(243, 235, 235, 0.3);
      backdrop-filter: blur(12px);
      z-index: 1;
      width: 400px; /* Slightly wider for better field readability */
      max-width: 90%; /* Responsive width */
      box-sizing: border-box;
      position: relative;
    }

    .registration-form::before {
      content: "";
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: radial-gradient(circle, rgba(230, 230, 230, 0.3), transparent 70%);
      z-index: -1;
      border-radius: 20px;
      animation: ambientGlow 3s infinite alternate ease-in-out;
    }

    @keyframes ambientGlow {
      0% { box-shadow: 0 0 15px rgba(0, 0, 0, 0.3); }
      100% { box-shadow: 0 0 35px rgb(255, 255, 255); }
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px; /* Slightly larger title */
      color: #ffffff;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #ffffff; /* White label color */
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 10px; /* Increased padding for inputs */
      border: none; /* Removed border */
      border-radius: 10px; /* More rounded */
      background: rgba(255, 255, 255, 0.1); /* Frosted input background */
      color: #ffffff; /* White text input */
      outline: none; /* Remove outline on focus */
      margin-bottom: 5px; /* Space between input and error message */
    }

    .form-group input::placeholder {
      color: #eee;
    }

    .form-group button {
      width: 100%;
      padding: 12px; /* Larger button */
      background-color: #f30400; /* Red button color */
      border: none;
      color: white;
      font-size: 18px; /* Larger font */
      border-radius: 10px; /* More rounded button */
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
      margin-top: 20px; /* Space above button */
    }

    .form-group button:hover {
      background-color: #c20300; /* Darker red on hover */
    }

    .clock {
      position: fixed;
      top: 20px;
      right: 20px;

      font-weight: bold;
      color: #f0f0f0;

      padding: 8px 12px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
      z-index: 1000;
    }

    .goback {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1001;
    }

      background-color: #f93030;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .goback button:hover {
      background-color: #c22626;
    }

    .error-message {
        color: #ffdddd;
        font-size: 0.85em;
        margin-top: 5px;
        display: none; /* Hidden by default */

  <div class="goback">
     <button onclick="window.location.href='index.html'">Go Back</button>
<a href="index.html">Go Back</a></div>

  <div class="registration-form">
    <h2>New User Registration</h2>
    <div>
    
<div id="errorMessage" style="color: #ffdddd; margin-bottom: 15px; font-weight: bold;"></div>
    </div>

    <form id="userRegistrationForm" action="RegisterServlet" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a Username" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required />
        <span class="error-message" id="passwordError"></span>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required />
        <span class="error-message" id="confirmPasswordError"></span>
      </div>

      <div class="form-group">
        <button type="submit">Register Account</button>
      </div>
    </form>
  </div>

  <div class="clock" id="clock"></div>

  <script>
    // Function to update the clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      hours = String(hours).padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;
      const location = Intl.DateTimeFormat().resolvedOptions().timeZone.replace("_", " ");
      document.getElementById('clock').textContent = `${timeString} (${location})`;
    }

    // Update clock every second
    setInterval(updateClock, 1000);
    updateClock(); // Initial call to display clock immediately

    // Client-side validation for passwords
    document.getElementById('userRegistrationForm').addEventListener('submit', function(event) {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const passwordError = document.getElementById('passwordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');

      let isValid = true;

      // Reset previous error messages
      passwordError.style.display = 'none';
      confirmPasswordError.style.display = 'none';

      // Password length check (example: at least 6 characters)
      if (password.length < 6) {
          passwordError.textContent = 'Password must be at least 6 characters long.';
          passwordError.style.display = 'block';
          isValid = false;
      }

      // Check if passwords match
      if (password !== confirmPassword) {
        confirmPasswordError.textContent = 'Passwords do not match.';
        confirmPasswordError.style.display = 'block';
        isValid = false;
      }

      if (!isValid) {
        event.preventDefault(); // Prevent form submission if validation fails
      }
    });

    // You can remove the togglePasswordVisibility if not needed for new user registration form
    // or keep it if you want to allow users to see their typed password.
    // function togglePasswordVisibility() {
    //   const passwordField = document.getElementById("password");
    //   passwordField.type = passwordField.type === "password" ? "text" : "password";
    //   const confirmPasswordField = document.getElementById("confirm_password");
    //   confirmPasswordField.type = confirmPasswordField.type === "password" ? "text" : "password";
    // }
  </script>
  <div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const errorDiv = document.getElementById('errorMessage');

        if (error === 'duplicate') {
            errorDiv.textContent = 'Registration Failed: Username or Email already exists.';
        } else if (error === 'failed') {
            errorDiv.textContent = 'Registration Failed. Please try again.';
        } else if (error === 'db') {
            errorDiv.textContent = 'A database error occurred. Please contact support.';
        }
    });
</script>
  </div>
